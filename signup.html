<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFinder - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css file/signup.css">
</head>
<body>

    <div class="signup-container">

        <div class="signup-box">

            <h1>JobFinder</h1>
            <h2>Create Account</h2>
            <p class="subtitle">Start your journey towards your dream job.</p>

            <div class="success-msg">
                <i>✓</i> Account created successfully!
            </div>

            <form id="signupForm">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name"
                    placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email"
                    placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password"
                    placeholder="Create password"
                    minlength="8" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword"
                    placeholder="Confirm your password" required>
                    <p class="error-msg"></p>
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <button type="submit" id="signupBtn">
                    Create Account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js files/signup.js"></script>
</body>
</html>
