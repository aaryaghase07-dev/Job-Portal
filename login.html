
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
<link rel="stylesheet" href="css file/login.css">


</head>
<body>

    <div class="login-container">

        <div class="login-left">
            <h1>Find Your <span>Dream Job.</span></h1>
            <p>Discover thousands of job opportunities and take the next step in your career.</p>
            <div class="illustration">
                <i class="fa-solid fa-briefcase"></i>
                <i class="fa-solid fa-user-tie"></i>
            </div>
            <h3>Your Career Starts Here!</h3>
        </div>

        <div class="login-right">
            <a href="index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>

            <div class="login-form">
                <h2>Welcome Back!</h2>
                <p class="subtitle">Login to access your account</p>


                <form id="loginForm">
                    <div class="success-msg">
                      <i class="fa-solid fa-circle-check"></i>
                     Login Successful! Welcome back.
                     </div>

                    <label>Email Address</label>
                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" placeholder="Enter your email" required>
                    </div>

                    <label>Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                       

                    

                    <button type="submit">Login <i class="fa-solid fa-arrow-right"></i></button>
                    

                </form>

                <p class="signup-text">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>
            </div>
        </div>

    </div>
<script src="js files/login.js"></script>
    
</body>
</html>
