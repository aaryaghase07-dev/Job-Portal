
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0d1321;
    padding: 25px;
}

.login-container {
    width: 900px;
    min-height: 550px;
    display: flex;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}

.login-left {
    width: 45%;
    background: linear-gradient(145deg, #182b49, #8982e7);
    color: white;
    padding: 65px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.login-left h1 {
    font-size: 36px;
    line-height: 1.3;
}

.login-left h1 span {
    color: #8982e7;
}

.login-left p {
    color: #d1dced;
    line-height: 1.7;
    margin-top: 18px;
}

.illustration {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 35px;
    margin: 45px 0;
    font-size: 65px;
    color: #a8d8ff;
}

.login-left h3 {
    text-align: center;
    font-size: 19px;
}

.login-right {
    width: 55%;
    padding: 35px 45px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.back-home {
    position: absolute;
    top: 30px;
    left: 40px;
    text-decoration: none;
    color: #555;
    font-size: 13px;
}

.login-form {
    width: 100%;
    max-width: 350px;
}

.login-form h2 {
    font-size: 30px;
    color: #182b49;
}

.subtitle {
    color: #888;
    margin: 10px 0 30px;
}

.login-form form > label {
    display: block;
    margin: 18px 0 9px;
    color: #333;
    font-size: 14px;
    font-weight: bold;
}

.input-box {
    display: flex;
    align-items: center;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 0 13px;
    height: 48px;
    gap: 10px;
}

.input-box:focus-within {
    border-color: #8982e7;
}

.input-box i {
    color: #777;
}

.input-box input {
    border: none;
    outline: none;
    width: 100%;
    font-size: 14px;
}

.toggle-password {
    cursor: pointer;
}

.form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0;
    font-size: 12px;
}

.remember {
    display: flex;
    gap: 6px;
    align-items: center;
}

.form-options a,
.signup-text a {
    color: #2868c7;
    text-decoration: none;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #8982e7;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #8982e7;
}

.signup-text {
    text-align: center;
    margin-top: 25px;
    font-size: 13px;
    color: #777;
}
.success-msg {
    display: none;
    background-color: #e8f8ee;
    color: #198754;
    border: 1px solid #a3dfb8;
    padding: 12px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 20px;
    align-items: center;
    gap: 8px;
}

.success-msg.succ {
    display: flex;
}


@media (max-width: 700px) {
    .login-container {
        width: 100%;
    }

    .login-left {
        display: none;
    }

    .login-right {
        width: 100%;
        min-height: 550px;
        padding: 60px 25px 30px;
    }

    .back-home {
        left: 25px;
    }
}
</style>

</head>
<body>

    <div class="login-container">

        <div class="login-left">
            <h1>Find Your <span>Dream Job.</span></h1>
            <p>Discover thousands of job opportunities and take the next step in your career.</p>
            <div class="illustration">
                <i class="fa-solid fa-briefcase"></i>
                <i class="fa-solid fa-user-tie"></i>
            </div>
            <h3>Your Career Starts Here!</h3>
        </div>

        <div class="login-right">
            <a href="index.html" class="back-home">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>

            <div class="login-form">
                <h2>Welcome Back!</h2>
                <p class="subtitle">Login to access your account</p>


                <form id="loginForm">
                    <div class="success-msg">
                      <i class="fa-solid fa-circle-check"></i>
                     Login Successful! Welcome back.
                     </div>

                    <label>Email Address</label>
                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" placeholder="Enter your email" required>
                    </div>

                    <label>Password</label>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                       

                    

                    <button type="submit">Login <i class="fa-solid fa-arrow-right"></i></button>
                    

                </form>

                <p class="signup-text">
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
